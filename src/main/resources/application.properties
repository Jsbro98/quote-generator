spring.application.name=quote-generator
spring.profiles.active=prod
# --- Log Levels ---
# logging.level.root=INFO
# logging.level.org.springframework.web=INFO
# logging.level.io.github.jsbro98.quotegenerator=INFO
# --- File Logging ---
logging.file.name=logs/app.json
# --- Rolling Policy ---
logging.logback.rollingpolicy.file-name-pattern=logs/app-%d{yyyy-MM-dd}.%i.json.gz
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=14
logging.logback.rollingpolicy.total-size-cap=2GB
logging.logback.rollingpolicy.clean-history-on-start=true
# --- Structured Logging (JSON) ---
logging.structured.format.file=ecs
# --- ZenQuotes API Base URL ---
zenquotes.base-url=https://zenquotes.io/api